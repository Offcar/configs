set -g mouse on
setw -g mode-keys vi

set-option -g renumber-windows on

set -g default-terminal "alacritty"
set -ag terminal-overrides ",alacritty:RGB"

set -g status-right "OFFCAR"

# Customizando status-bar: Verde oscuro, sin hora ni fecha
set -g status-style "bg=#202020,fg=#87af87"
set -g status-left-style "bg=#202020,fg=#87af87,bold"
set -g status-left-length 20

# Ventana activa
setw -g window-status-current-style "bg=#202020,fg=#afffaf,bold,underscore"
setw -g window-status-current-format " #I:#W "

# Ventanas inactivas
setw -g window-status-style "bg=#202020,fg=#87af87"
setw -g window-status-format " #I:#W "
